/* ============================================================
   MAKERS TASKS  —  색상 컨셉 (여기만 바꾸면 전체 톤이 바뀝니다)
   ============================================================ */
:root{
  /* 딥 포레스트 그린 — MAKERS 브랜드(랜딩·수석코치 문서와 동일 계열) */
  --forest-900:#0e1f17;
  --forest-800:#162e23;     /* 사이드바 = 브랜드 포레스트 */
  --forest-700:#1e3c2e;
  --forest-600:#2b5440;
  --cream:#f2efe3;          /* 포레스트 위 글자 */
  --cream-soft:#9db1a2;     /* 포레스트 위 보조 글자 */

  /* 웜 페이퍼 (브랜드 #FBFAF5 계열) */
  --paper:#f6f4eb;          /* 메인 배경 */
  --paper-2:#fffefb;        /* 카드 */
  --paper-3:#eeebdd;        /* 옅은 칩/바 */
  --line:#e3ded2;
  --line-strong:#ccc4b0;
  --ink:#1f2a24;            /* 본문 글자 */
  --ink-soft:#5c6b62;       /* 보조 글자 */

  /* 포인트 컬러 — 골드 · 파인그린 · 시그니처 레드 */
  --gold:#c58f23;           /* 강조/선택/일정 */
  --gold-ink:#8f6512;       /* 밝은 배경 위 골드 '글자'용(가독) */
  --pine:#2f6b4e;           /* 완료·진행 그린 */
  --red:#a81d2b;            /* 시그니처 레드(위험·최우선, 1포인트) */

  /* 우선순위 */
  --p-high:#a81d2b;
  --p-mid:#c58f23;
  --p-low:#8b9a8f;

  --radius:14px;
  --shadow:0 1px 2px rgba(16,30,23,.05), 0 6px 20px rgba(16,30,23,.07);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::selection{background:color-mix(in srgb,var(--gold) 25%,white)}

.app{display:grid;grid-template-columns:322px 1fr;height:100vh;overflow:hidden}

/* ---------- 사이드바 ---------- */
.sidebar{
  background:var(--forest-800);
  color:var(--cream);display:flex;flex-direction:column;
  padding:20px 14px;gap:6px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px}

.brand .logo{flex:none;width:17px;height:26px;background:#fff;
  -webkit-mask:var(--logo-mark) center/contain no-repeat;
          mask:var(--logo-mark) center/contain no-repeat}
.login-brand .logo{background:var(--forest-800)}
.brand b{font-size:17px;letter-spacing:.5px}

.side-label{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--cream-soft);
  padding:14px 8px 6px;text-transform:uppercase}

.proj-nav{display:flex;flex-direction:column;gap:2px}
.proj-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:9px 10px;border-radius:10px;color:var(--cream);transition:.13s;position:relative}
.proj-item:hover{background:rgba(255,255,255,.06)}
.proj-item.active{background:rgba(255,255,255,.11)}
.proj-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:3px;background:var(--pc,var(--pine))}
.proj-item .pi-dot{width:9px;height:9px;border-radius:50%;background:var(--pc);flex:0 0 auto}
.proj-item .pi-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-item .pi-cnt{font-size:11px;color:var(--cream-soft);font-weight:700;
  background:rgba(0,0,0,.22);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
/* ↑↓·공유·삭제 아이콘: 평상시엔 숨겨(display:none) 이름 열에 폭을 몰아주고, hover 때만 노출 */
.proj-item .pi-del{display:none;color:var(--cream-soft);font-size:15px;line-height:1;
  padding:0 2px;border-radius:4px}
.proj-item:hover .pi-del{display:inline;opacity:.7}
.proj-item .pi-del:hover{opacity:1;color:color-mix(in srgb,var(--red) 45%,white)}
.proj-item .pi-move{display:none;color:var(--cream-soft);font-size:12px;font-weight:800;line-height:1;
  padding:0 2px;border-radius:4px}
.proj-item:hover .pi-move{display:inline;opacity:.55}
.proj-item .pi-move:hover{opacity:1;color:var(--gold)}
.proj-item .pi-share{display:none;color:var(--cream-soft);font-size:13px;line-height:1;
  padding:0 3px;border-radius:4px}
.proj-item:hover .pi-share{display:inline;opacity:.7}
.proj-item .pi-share:hover{opacity:1;color:var(--gold)}
.proj-item .pi-edit{display:none;color:var(--cream-soft);font-size:12px;line-height:1;
  padding:0 3px;border-radius:4px}
.proj-item:hover .pi-edit{display:inline;opacity:.7}
.proj-item .pi-edit:hover{opacity:1;color:var(--gold)}
/* hover 불가(터치) 기기 — 아이패드 등 760px 초과 포함: hover로 드러낼 수 없으니 컨트롤을 항상 노출 */
@media(hover:none){.proj-item .pi-move,.proj-item .pi-del,.proj-item .pi-share,.proj-item .pi-edit{display:inline;opacity:.7}}
/* 고정 체크박스(주로 쓰는 프로젝트만 보기) · '전체/고정' 행 정렬용 여백 */
.proj-item .pi-pad{width:17px;flex:0 0 auto;text-align:center;font-size:12px;line-height:1}
.proj-item .pi-pin{width:17px;height:17px;border-radius:5px;border:1.7px solid var(--cream-soft);
  flex:0 0 auto;position:relative;transition:.12s;opacity:.5}
.proj-item:hover .pi-pin{opacity:.85}
.proj-item .pi-pin:hover{border-color:var(--gold);opacity:1}
.proj-item .pi-pin.on{background:var(--gold);border-color:var(--gold);opacity:1}
.proj-item .pi-pin.on::after{content:'';position:absolute;left:5px;top:1.5px;width:4px;height:8px;
  border:2px solid var(--forest-900);border-top:0;border-left:0;transform:rotate(45deg)}
.proj-hint{font-size:10.5px;color:var(--cream-soft);opacity:.8;padding:0 8px 7px;line-height:1.45}

.proj-add-btn{margin-top:4px;padding:9px 10px;border-radius:10px;color:var(--cream-soft);
  font-weight:600;text-align:left;transition:.13s;border:1px dashed rgba(255,255,255,.16)}
.proj-add-btn:hover{color:var(--cream);border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.04)}
.proj-add{display:flex;gap:6px;margin-top:4px}
.proj-add input{flex:1;min-width:0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);
  border-radius:9px;padding:8px 10px;color:var(--cream);outline:none}
.proj-add input::placeholder{color:var(--cream-soft)}
.proj-add input:focus{border-color:var(--gold)}
.proj-add button{flex:0 0 auto;white-space:nowrap;background:var(--gold);color:var(--forest-900);font-weight:700;border-radius:9px;padding:8px 14px}
/* 사이드바 페이지 이동 링크 (휴가 관리 등) */
.side-nav-link{display:block;margin-top:8px;padding:9px 10px;border-radius:10px;color:var(--cream-soft);
  font-weight:600;text-align:left;transition:.13s;border:1px solid rgba(255,255,255,.16);text-decoration:none}
.side-nav-link:hover{color:var(--cream);border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.04)}

.side-foot{margin-top:auto;padding-top:16px}
.side-stat{font-size:12px;color:var(--cream-soft);padding:0 8px 10px;font-weight:600}
.side-stat b{color:var(--cream)}
.hint{font-size:10.5px;color:var(--cream-soft);opacity:.85;padding:10px 8px 0;line-height:1.55}

/* ---------- 메인 ---------- */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 26px 0;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--paper-3);padding:4px;border-radius:11px}
.tab{padding:7px 15px;border-radius:8px;font-weight:700;color:var(--ink-soft);transition:.13s;font-size:13px}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--paper-2);color:var(--ink);box-shadow:0 1px 3px rgba(16,30,23,.1)}

.topbar .spacer{flex:1}
.donetoggle{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);
  font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.donetoggle input{width:15px;height:15px;accent-color:var(--pine);cursor:pointer}

/* 날짜 네비 */
.datenav{display:flex;align-items:center;gap:8px;padding:16px 26px 0}
.datenav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:var(--paper-2);font-size:17px;color:var(--ink-soft);transition:.13s;line-height:1}
.datenav button:hover{border-color:var(--line-strong);color:var(--ink)}
.datelabel{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;letter-spacing:-.3px}
.daybadge{font-size:11px;font-weight:800;color:var(--gold-ink);
  background:color-mix(in srgb,var(--gold) 12%,white);padding:3px 9px;border-radius:999px;letter-spacing:0}
.today-btn{width:auto!important;padding:0 12px;font-size:13px!important;font-weight:700;
  color:var(--pine)!important}
.datepick{margin-left:auto;border:1px solid var(--line);background:var(--paper-2);
  border-radius:9px;padding:7px 10px;color:var(--ink-soft);outline:none;cursor:pointer}
.datepick:focus{border-color:var(--gold)}
.dn-break{display:none}   /* 폰에서만 날짜네비를 두 줄로 강제 분리 */

/* 추가바 */
.addbar{display:flex;gap:8px;padding:16px 26px 4px;flex-wrap:wrap}
.addbar input#addText{flex:1;min-width:200px;background:var(--paper-2);border:1px solid var(--line);
  border-radius:11px;padding:12px 15px;outline:none;transition:.13s;font-size:14.5px}
.addbar input#addText:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 12%,transparent)}
.addbar select{background:var(--paper-2);border:1px solid var(--line);border-radius:11px;
  padding:0 10px;outline:none;cursor:pointer;font-weight:600;color:var(--ink-soft)}
.addbar select:focus{border-color:var(--gold)}
.add-btn{flex:0 0 auto;white-space:nowrap;background:var(--ink);color:var(--paper-2);font-weight:700;border-radius:11px;padding:0 20px;transition:.13s}
.add-btn:hover{background:var(--forest-900)}

/* 리스트 */
.listwrap{flex:1;overflow-y:auto;padding:10px 26px 60px}
.prog{display:flex;align-items:center;gap:11px;margin:8px 2px 16px}
.progbar{flex:1;height:8px;background:var(--paper-3);border-radius:999px;overflow:hidden}
.progbar i{display:block;height:100%;border-radius:999px;transition:width .35s ease;
  background:var(--pine)}
.progtxt{font-size:12px;color:var(--ink-soft);font-weight:700;white-space:nowrap}

.section-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;
  color:var(--ink-soft);margin:24px 2px 9px}
.section-h .dot{width:10px;height:10px;border-radius:50%}
.section-h .cnt{background:var(--paper-3);border-radius:999px;padding:1px 8px;font-size:11px}
.section-h.backlog{color:var(--gold-ink)}

.task{display:flex;align-items:center;gap:11px;background:var(--paper-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow);
  transition:.14s;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.task:hover{border-color:var(--line-strong)}
.task.done{background:color-mix(in srgb,var(--paper-3) 60%,var(--paper-2));border-color:transparent;box-shadow:none}
.task.done .ttext{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line-strong)}

.check{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ink-soft) 55%,var(--line-strong));
  flex:0 0 auto;position:relative;transition:.15s}
.check:hover{border-color:var(--pine)}
.check::after{content:'';position:absolute;left:6px;top:2.5px;width:5px;height:10px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) scale(0);
  transform-origin:center;transition:transform .15s ease}
.task.done .check{background:var(--pine);border-color:var(--pine)}
.task.done .check::after{transform:rotate(45deg) scale(1)}

.pdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.pdot.high{background:var(--p-high)} .pdot.mid{background:var(--p-mid)} .pdot.low{background:var(--p-low)}

.ttext{flex:1;cursor:text;word-break:break-word;font-weight:500;display:flex;align-items:center;gap:6px}
.noteicon{font-size:12px;cursor:help;filter:saturate(.4)}

.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:700;flex:0 0 auto}
.pill.proj{color:color-mix(in srgb,var(--pc) 55%,var(--ink));background:color-mix(in srgb,var(--pc) 15%,white)}
.pill.proj.etc{color:var(--ink-soft);background:var(--paper-3)}
.pill.date{color:var(--ink-soft);background:var(--paper-3)}
.pill.date.none{color:color-mix(in srgb,var(--red) 60%,var(--ink-soft));background:color-mix(in srgb,var(--red) 9%,white)}
.pill.range{color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 13%,white)}
.pill.range b{font-weight:700;margin-left:3px}
.pill.carry{color:var(--gold-ink);background:color-mix(in srgb,var(--p-mid) 14%,white)}
.pill.carry b{font-weight:800;margin-left:2px}

.acts{display:flex;align-items:center;gap:3px;opacity:0;transition:.13s;flex:0 0 auto}
.task:hover .acts,.task:focus-within .acts{opacity:1}
.iconbtn{width:30px;height:30px;border-radius:8px;font-size:14px;color:var(--ink-soft);transition:.12s;line-height:1}
.iconbtn:hover{background:var(--paper-3);color:var(--ink)}
.iconbtn.post{font-weight:800}
@media(hover:none){.acts{opacity:1}}

/* 드래그 순서 변경 */
.grip{flex:0 0 auto;cursor:grab;color:var(--ink-soft);font-size:15px;line-height:1;padding:0 1px;
  user-select:none;opacity:.7;transition:.12s;letter-spacing:-2px}
.grip:hover{opacity:1;color:var(--ink-soft)}
.grip:active{cursor:grabbing}
.task.dragging{opacity:.4}
.task.drop-before{box-shadow:inset 0 3px 0 -1px var(--gold)}
.task.drop-after{box-shadow:inset 0 -3px 0 -1px var(--gold)}

/* 인라인 편집 */
.task.editing{display:block;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 10%,transparent)}
.editform{display:flex;flex-direction:column;gap:9px}
.editform .ef-text{border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;font-weight:600}
.editform .ef-text:focus{border-color:var(--gold)}
.ef-row{display:flex;gap:8px;flex-wrap:wrap}
.ef-row select,.ef-row input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  outline:none;background:var(--paper-2);font-weight:600;color:var(--ink-soft)}
.ef-row select:focus,.ef-row input:focus{border-color:var(--gold)}
.ef-row .ef-tilde{display:inline-flex;align-items:center;color:var(--ink-soft);font-weight:800;padding:0 1px}
.ef-note{border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none;
  resize:vertical;min-height:54px;font-family:inherit}
.ef-note:focus{border-color:var(--gold)}
.ef-acts{display:flex;gap:7px;align-items:center}
.btn{padding:8px 16px;border-radius:9px;font-weight:700;border:1px solid var(--line);background:var(--paper-2);transition:.12s}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--forest-800);color:var(--cream);border-color:var(--forest-800)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{margin-left:auto;color:var(--red);border-color:transparent}
.btn.danger:hover{background:color-mix(in srgb,var(--red) 10%,white)}

/* 빈 상태 */
.empty{text-align:center;padding:54px 20px;color:var(--ink-soft)}
.empty .em{font-size:42px;opacity:.85}
.empty h3{margin:14px 0 5px;font-size:15px;color:var(--ink);font-weight:700}
.empty p{font-size:13px}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
  background:var(--ink);color:var(--paper-2);padding:11px 20px;border-radius:11px;
  font-weight:600;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 반응형 */
/* ============================================================
   📱 폰 버전 — 데스크톱과 완전히 다른 레이아웃
   상단 고정 앱바(햄버거) · 왼쪽 서랍(프로젝트/계정) · 하단 FAB+바텀시트 추가
   (mobilebar/fab/scrim 은 데스크톱에선 숨김)
   ============================================================ */
.mobilebar,.fab,.scrim{display:none}

@media(max-width:760px){
  .app{display:block;height:auto;min-height:100vh;overflow:visible}
  .main{display:block;min-height:100vh;overflow:visible;padding-top:calc(52px + env(safe-area-inset-top))}

  /* 상단 앱바(고정) — PWA 전체화면일 때 상태바(노치) 영역까지 포레스트로 채움 */
  .mobilebar{display:flex;align-items:center;gap:8px;position:fixed;top:0;left:0;right:0;height:calc(52px + env(safe-area-inset-top));z-index:40;
    background:var(--forest-800);color:var(--cream);padding:env(safe-area-inset-top) 10px 0;box-shadow:0 2px 10px rgba(16,30,23,.2)}
  .mb-btn{width:40px;height:40px;border-radius:10px;color:var(--cream);font-size:21px;line-height:1;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mb-btn:active{background:rgba(255,255,255,.12)}
  .mb-title{flex:1;display:flex;align-items:baseline;gap:6px;min-width:0}
  .mb-title b{font-size:16px;letter-spacing:.5px}

  /* 서랍(사이드바) — 왼쪽에서 슬라이드 */
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:84%;max-width:320px;z-index:60;
    transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    flex-direction:column;flex-wrap:nowrap;align-items:stretch;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;gap:6px;overflow-y:auto;
    box-shadow:4px 0 26px rgba(0,0,0,.32)}
  body.nav-open .sidebar{transform:none}
  .brand{padding:4px 8px 14px}
  .side-label{display:block}
  .proj-nav{flex-direction:column;flex-wrap:nowrap;flex:none;gap:2px}
  .proj-item{width:100%;padding:11px 12px}
  .proj-item.active::before{display:block}
  .proj-item .pi-del,.proj-item .pi-share,.proj-item .pi-edit{display:inline}
  .proj-item .pi-move{display:inline;opacity:.55;padding:0 5px;font-size:14px}
  .proj-item .pi-pin{width:22px;height:22px;opacity:.8;margin-right:2px}
  .proj-item .pi-pin.on::after{left:6.5px;top:3px;width:5px;height:9px}
  /* 터치 영역 확대(세로+왼쪽 여백 쪽으로만 — 이름 영역은 안 뺏음): 오탭 감소 */
  .proj-item .pi-pin::before{content:'';position:absolute;top:-11px;bottom:-11px;left:-10px;right:-2px}
  .proj-item .pi-pad{width:22px}
  .proj-add-btn{margin-top:4px}
  .side-foot{margin-top:auto;padding-top:16px;display:block;width:auto}
  .side-stat{padding:0 8px 10px;white-space:normal}
  .hint{display:block}

  /* 스크림(서랍/시트 뒤 어둠) */
  .scrim{display:block;position:fixed;inset:0;z-index:50;background:rgba(10,18,14,.55);
    opacity:0;pointer-events:none;transition:opacity .24s}
  body.nav-open .scrim,body.sheet-open .scrim{opacity:1;pointer-events:auto}

  /* 서브헤더(탭/필터) — sticky */
  .topbar{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:20;background:var(--paper);gap:9px;padding:11px 14px 2px;
    flex-wrap:wrap;align-items:center;box-shadow:0 8px 10px -9px rgba(16,30,23,.3)}
  .tabs{flex:1 1 auto}
  .tab{flex:1;text-align:center;padding:9px 6px;font-size:13px}
  .topbar .spacer{display:none}
  #itemFilter{flex:1 1 100%}
  #itemFilter button{flex:1}
  .donetoggle{order:4}

  /* 날짜 네비: 폰에선 의도적으로 두 줄 — [‹ 날짜 › 오늘] / [일주월  날짜선택] */
  .datenav{padding:11px 14px 4px;flex-wrap:wrap;gap:8px;row-gap:10px;align-items:center}
  .datenav .datelabel{flex:1 1 auto;min-width:0;font-size:16px}
  .dn-break{display:block;flex-basis:100%;width:100%;height:0;margin:0}
  #periodSeg{margin-left:0!important;flex:1 1 auto}
  #periodSeg button{flex:1;padding:9px 0}
  .datepick{margin-left:0;flex:0 0 auto}

  /* 리스트 — 큰 터치 영역, FAB 공간 확보 */
  .listwrap{flex:none;overflow:visible;padding:12px 14px 104px}
  .task{padding:15px 14px;gap:12px}
  .check{width:26px;height:26px}
  .grip{display:none}
  /* 폰: 기간 배지·액션버튼 숨겨 내용에 폭 몰아주기 (수정=내용 탭, 삭제=수정창 안 삭제) */
  .task .acts{display:none}
  .task .pill.date,.task .pill.range,.task .pill.carry{display:none}
  .ttext{font-size:15px}

  /* 추가바 → 바텀시트(FAB로 열기) */
  .addbar{position:fixed;left:0;right:0;bottom:0;z-index:60;flex-direction:column;gap:11px;align-items:stretch;
    background:var(--paper-2);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:20px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 34px rgba(16,30,23,.22);
    transform:translateY(115%);transition:transform .26s cubic-bezier(.4,0,.2,1)}
  body.sheet-open .addbar{transform:none}
  .addbar::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:99px;background:var(--line-strong)}
  .addbar input#addText{width:100%;min-width:0;font-size:16px;padding:14px 15px}
  .addbar>select,.addbar input[type=time]{width:100%;height:48px;font-size:15px}
  .add-btn{width:100%;padding:14px;font-size:15px}

  /* FAB(추가) */
  .fab{display:flex;align-items:center;justify-content:center;position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:45;
    width:58px;height:58px;border-radius:50%;background:var(--gold);color:var(--forest-900);font-size:32px;line-height:1;
    box-shadow:0 8px 22px color-mix(in srgb,var(--gold) 45%,transparent)}
  .fab:active{transform:scale(.93)}
  body.sheet-open .fab{opacity:0;pointer-events:none;transform:scale(.6)}

  /* 로그인/모달은 최상단 */
  .loginscreen{z-index:70}
  .login-card{width:100%}
  .login-card input,.login-card select{font-size:16px}
  .ef-text,.ef-row input,.ef-row select,.ef-note{font-size:16px}
}

/* ---------- 계정 정보/버튼 (원격 모드 로그인 시) — 윗줄 이름(이메일), 아랫줄 버튼 ---------- */
.acct{display:flex;flex-direction:column;gap:7px;padding:0 4px 10px}
.acct[hidden]{display:none}
.acct-who{font-size:12px;color:var(--cream-soft);font-weight:600;line-height:1.4;word-break:break-word;padding-left:6px}
.acct-who b{color:var(--cream);font-weight:800;font-size:12.5px}
.acct-who .acct-mail{color:var(--cream-soft);opacity:.85;font-weight:600}
.acct-actions{display:flex;flex-wrap:wrap;gap:5px}
.acct-out{flex:1 1 auto;text-align:center;color:var(--cream-soft);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 4px;font-weight:700;white-space:nowrap;font-size:10.5px}
.acct-out:hover{color:var(--cream);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
/* 프로젝트 추가 폼: 이름은 한 줄 전체, 공유선택+추가는 다음 줄 */
.proj-add{flex-wrap:wrap}
.proj-add #projName{flex:1 0 100%}
.proj-add select{flex:1;min-width:0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:8px 8px;color:var(--cream);outline:none;font-weight:600}
.proj-add select:focus{border-color:var(--gold)}
.pi-lock{opacity:.65;font-size:10px;margin-left:2px}

/* ---------- 로그인 화면 (기본 숨김 · 로컬 모드에선 절대 표시 안 됨) ---------- */
.loginscreen{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:var(--paper);padding:20px}
.loginscreen[hidden]{display:none}
.login-card{width:340px;max-width:100%;display:flex;flex-direction:column;gap:12px;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.login-brand{justify-content:center;padding:0 0 6px}
.login-card h2{font-size:18px;font-weight:800;color:var(--ink);text-align:center}
.login-card input{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:12px 14px;outline:none;transition:.13s}
.login-card input:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 12%,transparent)}
.login-err{color:var(--red);font-size:12.5px;font-weight:600;text-align:center}
.login-err[hidden]{display:none}
.login-toggle{color:var(--gold-ink);font-weight:700;font-size:12.5px;padding:4px}
.login-card select{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;font:inherit;color:var(--ink)}
.login-card select:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 12%,transparent)}
.share-members{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);border-radius:11px;padding:11px;background:var(--paper)}
.share-members[hidden]{display:none}
.share-members label{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink);cursor:pointer;line-height:1.3}
.share-members input{width:16px;height:16px;accent-color:var(--pine);flex:0 0 auto}
.share-members .empty-dir{color:var(--ink-soft);font-size:12.5px;text-align:center;padding:6px 0}
.share-members .dir-mail{color:var(--ink-soft);font-size:11px;font-weight:500}

/* ---------- 세그먼트(항목 필터 · 기간) ---------- */
.segbar{display:flex;gap:4px;background:var(--paper-3);padding:3px;border-radius:9px}
.segbar button{display:flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:7px;font-weight:700;font-size:12px;color:var(--ink-soft);transition:.12s;white-space:nowrap;line-height:1}
.segbar button:hover{color:var(--ink)}
.segbar button.active{background:var(--paper-2);color:var(--ink);box-shadow:0 1px 2px rgba(16,30,23,.12)}

/* ---------- 추가바: 일정 시간 입력 ---------- */
.addbar input[type=time]{background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:0 10px;outline:none;font-weight:600;color:var(--ink-soft)}
.addbar input[type=time]:focus{border-color:var(--gold)}

/* ---------- 일정(event) 카드 ---------- */
.task.event{background:color-mix(in srgb,var(--gold) 5%,var(--paper-2));border-color:color-mix(in srgb,var(--gold) 20%,var(--line))}
.task.event:hover{border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.evmark{width:22px;height:22px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:12px;background:color-mix(in srgb,var(--gold) 16%,white)}
.pill.time{color:var(--gold-ink);background:color-mix(in srgb,var(--gold) 15%,white);font-weight:800}

/* ---------- 주 뷰(요일 7열 그리드 · 한눈에) ---------- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;align-items:stretch}
.wk-col{border:1px solid var(--line);border-radius:10px;background:var(--paper-2);display:flex;flex-direction:column;min-height:220px;overflow:hidden}
.wk-col.today{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 16%,transparent)}
.wk-head{padding:7px 9px;border-bottom:1px solid var(--line);background:var(--paper-3);cursor:pointer;
  display:flex;flex-direction:column;gap:1px;transition:.12s}
.wk-head:hover{background:var(--paper-3);filter:brightness(.98)}
.wk-head .d{font-weight:800;font-size:15px;color:var(--ink);line-height:1.1}
.wk-head .wd{font-size:11px;color:var(--ink-soft);font-weight:700}
.wk-head .sun{color:var(--red)}.wk-head .sat{color:#4a6d8c}
.wk-col.today .wk-head{background:color-mix(in srgb,var(--gold) 11%,white)}
.wk-col.today .wk-head .d,.wk-col.today .wk-head .wd{color:var(--gold-ink)}
.wk-body{padding:6px;display:flex;flex-direction:column;gap:4px;flex:1}

  padding:4px 6px;border-radius:7px;border-left:3px solid var(--pc,var(--line-strong));

.wk-item:hover{filter:brightness(.97)}

.wk-item.done{opacity:.65}

.wk-check:hover{border-color:var(--pine)}
.wk-check::after{content:'';position:absolute;left:3px;top:.5px;width:3.5px;height:7px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg) scale(0);transition:transform .12s}
.wk-item.done .wk-check{background:var(--pine);border-color:var(--pine)}
.wk-item.done .wk-check::after{transform:rotate(45deg) scale(1)}
.wk-time{font-weight:800;color:var(--gold-ink);flex:0 0 auto;font-size:10.5px}

<script>
"use strict";
const PROJECT_COLORS=['#c58f23','#2f6b4e','#a81d2b','#4a6d8c','#b3702f','#7f9a48','#3f8577','#7a4650','#8a5f45','#8b9a8f'];
/* 구(브라운+보라 테마) 프로젝트 색 → 새 MAKERS 팔레트로 표시 시 리매핑.
   다른 팀원 소유 프로젝트는 RLS 때문에 DB값을 못 바꾸므로 화면단에서 흡수한다. */
const LEGACY_PROJECT_COLORS={'#7c5cff':'#7a4650','#9b7bff':'#7a4650','#2fd98a':'#2f6b4e','#3dd6c0':'#3f8577',
  '#ff8a5c':'#b3702f','#ffc24b':'#c58f23','#4bc0ff':'#4a6d8c','#5ac8fa':'#8b9a8f','#ff6b9d':'#a81d2b','#ff6b6b':'#a81d2b'};
const themeColor=c=>{c=(c||'').toLowerCase();c=LEGACY_PROJECT_COLORS[c]||c;return /^#[0-9a-f]{3,8}$/.test(c)?c:'#8b9a8f';}; // hex만 허용(style 주입 차단)
const PRI_EMOJI={high:'🔴',mid:'🟡',low:'🟢'};
const WD=['일','월','화','수','목','금','토'];

/* ---------- 유틸 ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function parseYmd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtDateKo(s){const d=parseYmd(s);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;}
function fmtShort(s){const d=parseYmd(s);return `${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]})`;}
function relLabel(s){const t=ymd(new Date());if(s===t)return '오늘';const d=parseYmd(t);d.setDate(d.getDate()+1);if(s===ymd(d))return '내일';d.setDate(d.getDate()-2);if(s===ymd(d))return '어제';return '';}
function md(s){const d=parseYmd(s);return `${d.getMonth()+1}.${d.getDate()}`;}
function dateDiff(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000);}
const todayYmd=()=>ymd(new Date());
/* 표시상 '실제 종료일': ①사용자가 지정한 기간 ②완료한 '할 일' → 완료한 날(doneAt)까지 ③미완료+과거시작 → 오늘까지 자동 연장 ④단일/일정 → 자기 날짜까지만 */
function effEnd(t){
  if(!t.date)return null;
  if(t.endDate&&t.endDate>t.date)return t.endDate;        // 지정 기간(완료 여부 무관)
  if(t.type!=='event'){
    if(t.done){ return (t.doneAt&&t.doneAt>t.date)?t.doneAt:t.date; } // 완료한 '할 일' → 완료한 날을 종료일로(여러 날 진행한 분량 보존, 첫날로 접히지 않음)
    const ty=todayYmd(); if(t.date<ty)return ty;          // '할 일' 미완료 + 과거 시작 → 오늘까지 자동 연장
  }
  return t.date;                                           // 단일/일정 → 시작일까지만
}
/* 작업이 날짜 sd에 표시되는가 (시작~실제종료 사이 모든 날) */
function spansDate(t,sd){if(!t.date)return false;const end=effEnd(t);return t.date<=sd&&sd<=end;}
/* 카드 날짜 배지 정보. kind: none | single | range(지정기간·완료한 여러날 스팬) | carry(자동연장 미완료) */
function dateMeta(t){
  if(!t.date)return{kind:'none'};
  const explicit=!!(t.endDate&&t.endDate>t.date);
  const end=effEnd(t);
  if(end<=t.date)return{kind:'single'};
  const total=dateDiff(t.date,end)+1;
  let idx=dateDiff(t.date,state.ui.selectedDate)+1;if(idx<1)idx=1;if(idx>total)idx=total;
  const carry=!explicit&&!t.done;
  return{kind:carry?'carry':'range',total,idx,short:`${md(t.date)}~${md(end)}`,startKo:fmtShort(t.date),endKo:fmtShort(end)};
}

/* ---------- 상태 ---------- */
function defaultState(){
  const p1=uid(),p2=uid();
  return{
    tasks:[],
    projects:[{id:p1,name:'랜딩',color:'#c58f23',shared:true,members:[]},{id:p2,name:'간판',color:'#2f6b4e',shared:true,members:[]}],
    ui:{view:'date',period:'day',itemFilter:'all',selectedDate:ymd(new Date()),projectFilter:'all',showDone:true,editingId:null,projSort:[],projFilter:[]}
  };
}
function migrate(s){
  s.tasks=Array.isArray(s.tasks)?s.tasks:[];
  s.projects=Array.isArray(s.projects)?s.projects:[];
  s.ui=Object.assign({view:'date',period:'day',itemFilter:'all',selectedDate:ymd(new Date()),projectFilter:'all',showDone:true,editingId:null,projSort:[],projFilter:[]},s.ui||{});
  s.ui.selectedDate=ymd(new Date()); // 열 때 항상 오늘로
  s.ui.editingId=null;
  if(!Array.isArray(s.ui.projSort))s.ui.projSort=[];
  if(!Array.isArray(s.ui.projFilter))s.ui.projFilter=[];
  if(['day','week','month'].indexOf(s.ui.period)<0)s.ui.period='day';
  if(['all','task','event'].indexOf(s.ui.itemFilter)<0)s.ui.itemFilter='all';
  s.tasks.forEach(t=>{t.priority=t.priority||'mid';t.note=t.note||'';t.type=(t.type==='event'?'event':'task');if(!('time'in t))t.time=null;if(!('date'in t))t.date=null;if(!('endDate'in t))t.endDate=null;if(!('doneAt'in t))t.doneAt=null;});
  s.projects.forEach(p=>{if(!('shared'in p))p.shared=true; if(!Array.isArray(p.members))p.members=[]; p.color=themeColor(p.color);}); // 기존 프로젝트는 팀 공유 기본값 + 구팔레트 색 리매핑
  return s;
}
/* ---------- 백엔드 설정 ----------
   REMOTE=true → Supabase 클라우드(로그인·기기간 동기화). false → 이 브라우저 로컬 전용.
   publishable 키는 공개용이라 노출돼도 안전(RLS + anon 권한 없음으로 보호). */
const SUPABASE_URL='https://bmejvuxyszbibjdegnxz.supabase.co';
const SUPABASE_KEY='sb_publishable_GbCZImWWSbQhBp1m5BPq6A_-QBcFLMz';
const REMOTE=true;

/* ---------- 저장소 추상화(Store) ----------
   앱 전체에서 localStorage를 직접 만지는 '유일한' 곳. 백엔드 어댑터(Supabase REST)도 여기 안에.
   렌더/이벤트/시드 코드는 모드와 무관하게 그대로 동작합니다.
   - 동기화 대상 데이터(tasks/projects)  → DATA_KEY
   - 기기별 로컬 환경설정(ui + 마이그레이션 플래그) → PREFS_KEY (서버로 안 올라감)
   - 인증 토큰 → AUTH_KEY (로컬 전용)
   _data/_prefs 는 '한 번 만들고 영원히 제자리(in-place)로만' 변경 — 재할당 금지. */
const Store = (function(){
  const DATA_KEY='makers_tasks_v1', PREFS_KEY='makers_ui_v1', AUTH_KEY='makers_auth_v1';
  let _mode = REMOTE ? 'remote' : 'local';   // 'local' | 'remote'
  const _data={tasks:[],projects:[]};        // 한 번 생성, 절대 재할당 안 함
  let _prefs={};                             // init()에서 1회 할당, 이후 제자리 변경
  let _batch=0;
  let _tok=null, _me=null, _dir=null, _onChange=null;
  const enc=encodeURIComponent;
  // ---- 필드 매핑 (앱 객체 ↔ Supabase 행: text↔title, date↔start_date 등) ----
  function taskToRow(t){ return {id:t.id,title:t.text,type:(t.type==='event'?'event':'task'),project:t.project||null,priority:t.priority||'mid',done:!!t.done,start_date:t.date||null,end_date:t.endDate||null,event_time:t.time||null,done_at:t.doneAt||null,note:t.note||'',sort:(typeof t.sort==='number'?t.sort:null)}; }

  addPriority=$('addPriority'),addForm=$('addForm'),projForm=$('projForm'),projName=$('projName'),
  dateNav=$('dateNav'),dateMain=$('dateMain'),dayBadge=$('dayBadge'),datePick=$('datePick'),
  listContainer=$('listContainer'),showDone=$('showDone'),
  sideStat=$('sideStat');

/* ---------- 렌더 ---------- */
function visibleTasks(){
  let t=state.tasks.slice();
  const pf=state.ui.projectFilter;
  if(pf==='pinned'){ const set=new Set(state.ui.projFilter||[]); t=t.filter(x=>set.has(x.project)); }  // 고정: 체크한 프로젝트만
  else if(pf!=='all')t=t.filter(x=>x.project===pf);                                                     // 단일 프로젝트 드릴다운
  const itf=state.ui.itemFilter||'all';
  if(itf==='task')t=t.filter(x=>x.type!=='event');
  else if(itf==='event')t=t.filter(x=>x.type==='event');
  if(!state.ui.showDone)t=t.filter(x=>!x.done);   // 일정은 done=false라 항상 남음
  return t;
}
const isEvent=t=>t.type==='event';
/* 계정별 프로젝트 순서: ui.projSort(id 배열) 순 → 목록에 없는 프로젝트는 만든 순서대로 뒤에 */
function orderedProjects(){
  const ord=state.ui.projSort||[];
  const pos=id=>{const i=ord.indexOf(id);return i<0?9999:i;};
  return state.projects.slice().sort((a,b)=>pos(a.id)-pos(b.id));   // sort는 안정 정렬
}
function projOrder(pid){const i=orderedProjects().findIndex(p=>p.id===pid);return i<0?9999:i;}
function moveProject(id,dir){
  const list=orderedProjects().map(p=>p.id);
  const i=list.indexOf(id),j=i+dir;
  if(i<0||j<0||j>=list.length)return;
  list.splice(i,1);list.splice(j,0,id);
  Store.prefs.saveProjOrder(list);
  renderProjects();renderList();
}
/* 고정(체크) 토글: 체크한 프로젝트만 보기. 계정별(user_prefs.proj_filter)로 로그인해도 유지 */
function togglePin(id){
  if(!id||id==='all'||id==='pinned')return;
  const set=Array.isArray(state.ui.projFilter)?state.ui.projFilter.slice():[];
  const i=set.indexOf(id);
  if(i>=0)set.splice(i,1); else set.push(id);
  Store.prefs.saveProjFilter(set);                          // 서버+로컬 저장, state.ui.projFilter 즉시 갱신
  if(set.length)state.ui.projectFilter='pinned';            // 체크하면 바로 '고정만 보기'
  else if(state.ui.projectFilter==='pinned')state.ui.projectFilter='all';   // 다 풀면 전체로
  if(set.length&&!state.ui._pinHintSeen){ toast('체크한 프로젝트만 표시돼요 · ‘전체’로 모두 보기'); state.ui._pinHintSeen=true; } // 최초 1회 안내
  Store.prefs.save();
  renderProjects();renderList();
}
/* 고정 필터 정합성 정리. promote=true(최초 로그인)일 때만 고정 셋이 있으면 기본 뷰를 '고정'으로 승격.
   리로드(promote 없음)에서는 사용자가 명시적으로 고른 '전체'를 존중(강제 복귀 안 함). */
function normalizeProjFilter(promote){
  if(!Array.isArray(state.ui.projFilter))state.ui.projFilter=[];
  const ids=new Set(state.projects.map(p=>p.id));
  const cleaned=state.ui.projFilter.filter(id=>ids.has(id));
  if(cleaned.length!==state.ui.projFilter.length)state.ui.projFilter=cleaned;   // 화면용 정리(재저장은 다음 토글 때)
  const pf=state.ui.projectFilter;
  if(pf==='pinned'&&cleaned.length===0)state.ui.projectFilter='all';                       // 고정인데 셋이 비면 전체
  else if(pf!=='all'&&pf!=='pinned'&&!ids.has(pf)){state.ui.projectFilter=cleaned.length?'pinned':'all';Store.prefs.save();} // 없어진 단일 프로젝트 드릴다운 → 빈 보드 방지
  else if(promote&&pf==='all'&&cleaned.length>0){state.ui.projectFilter='pinned';Store.prefs.save();}                        // 로그인 시에만 고정을 기본 뷰로
}
/* 하루/전체 목록 정렬: ①일정을 위로(시간순) ②그다음 할 일 — 완료는 맨 아래, 미완료는 프로젝트별 */
function cmpItems(a,b){
  const ae=isEvent(a),be=isEvent(b);
  if(ae!==be)return ae?-1:1;
  if(ae&&be){const at=a.time||'99:99',bt=b.time||'99:99';return at!==bt?(at<bt?-1:1):0;}
  if(a.done!==b.done)return a.done?1:-1;            // 완료된 할 일 → 아래
  const pa=projOrder(a.project),pb=projOrder(b.project);
  if(pa!==pb)return pa-pb;                          // 프로젝트별
  return 0;                                         // 안정정렬: 수동 드래그 순서 유지
}
/* 프로젝트 그룹 안(여러 날짜 혼재): 완료된 '할 일'만 맨 아래, 나머지는 날짜·시간순 */
function cmpProjGroup(a,b){
  const ad=(!isEvent(a)&&a.done)?1:0,bd=(!isEvent(b)&&b.done)?1:0;
  if(ad!==bd)return ad-bd;
  const asd=a.date||'9999',bsd=b.date||'9999';
  if(asd!==bsd)return asd<bsd?-1:1;
  const at=a.time||'99:99',bt=b.time||'99:99';
  return at!==bt?(at<bt?-1:1):0;
}
/* 전체 뷰: ①완료 여부 최우선(미완료·일정 먼저, 완료된 할 일은 전부 맨 아래) ②프로젝트별 ③날짜·시간 */
function cmpAllView(a,b){
  const ad=(!isEvent(a)&&a.done)?1:0,bd=(!isEvent(b)&&b.done)?1:0;
  if(ad!==bd)return ad-bd;
  const pa=projOrder(a.project),pb=projOrder(b.project);
  if(pa!==pb)return pa-pb;
  const asd=a.date||'9999',bsd=b.date||'9999';
  if(asd!==bsd)return asd<bsd?-1:1;
  const at=a.time||'99:99',bt=b.time||'99:99';
  return at!==bt?(at<bt?-1:1):0;
}

function syncHeader(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===state.ui.view));
  const isDate=state.ui.view==='date',period=state.ui.period||'day';
  dateNav.style.display=isDate?'flex':'none';
  document.querySelectorAll('#periodSeg button').forEach(b=>b.classList.toggle('active',b.dataset.p===period));
  if(isDate){
    const base=parseYmd(state.ui.selectedDate);
    dayBadge.style.display='none';
    if(period==='day'){
      dateMain.textContent=fmtDateKo(state.ui.selectedDate);
      const r=relLabel(state.ui.selectedDate);
      dayBadge.textContent=r;dayBadge.style.display=r?'inline-flex':'none';
    }else if(period==='week'){
      const s=new Date(base);s.setDate(base.getDate()-base.getDay());
      const e=new Date(s);e.setDate(s.getDate()+6);
      dateMain.textContent=`${s.getMonth()+1}.${s.getDate()} ~ ${e.getMonth()+1}.${e.getDate()}`;
    }else{
      dateMain.textContent=`${base.getFullYear()}년 ${base.getMonth()+1}월`;
    }
    datePick.value=state.ui.selectedDate;
  }
  const itf=state.ui.itemFilter||'all';
  document.querySelectorAll('#itemFilter button').forEach(b=>b.classList.toggle('active',b.dataset.f===itf));
  showDone.checked=state.ui.showDone;
}

function renderProjects(){
  const cnt={};state.tasks.forEach(t=>{if(t.type!=='event'&&!t.done)cnt[t.project]=(cnt[t.project]||0)+1;});
  const all=state.tasks.filter(t=>t.type!=='event'&&!t.done).length;
  const pinned=new Set(state.ui.projFilter||[]);
  const meId=(Store.mode!=='local'&&Store.auth.isAuthenticated()&&Store.auth.currentUser())?Store.auth.currentUser().id:null;
  let h=`<button class="proj-item${state.ui.projectFilter==='all'?' active':''}" data-action="select-project" data-id="all" style="--pc:var(--pine)"><span class="pi-pad"></span><span class="pi-name">전체</span><span class="pi-cnt">${all}</span></button>`;
  if(pinned.size){   // 고정 프로젝트가 하나라도 있으면 '고정' 바로가기 노출(체크한 프로젝트만 보기)
    const pcnt=state.tasks.filter(t=>t.type!=='event'&&!t.done&&pinned.has(t.project)).length;
    h+=`<button class="proj-item${state.ui.projectFilter==='pinned'?' active':''}" data-action="select-project" data-id="pinned" style="--pc:var(--gold)" title="체크한 프로젝트만 보기"><span class="pi-pad"></span><span class="pi-name">📌 고정 <span class="pi-lock">${pinned.size}</span></span><span class="pi-cnt">${pcnt}</span></button>`;
  }
  const plist=orderedProjects();
  plist.forEach((p,pi)=>{
    const mine = Store.mode==='local' || (p.owner && meId && p.owner===meId);
    const on = pinned.has(p.id);
    let badge='';
    if(p.shared!==true){ badge = (p.members&&p.members.length) ? `<span class="pi-lock" title="${p.members.length}명에게 공유">🎯${p.members.length}</span>` : '<span class="pi-lock" title="개인 프로젝트(나만)">🔒</span>'; }
    const up = pi>0?`<span class="pi-move" data-action="proj-up" data-id="${p.id}" title="위로">↑</span>`:'';
    const dn = pi<plist.length-1?`<span class="pi-move" data-action="proj-down" data-id="${p.id}" title="아래로">↓</span>`:'';
    const ren = mine?`<span class="pi-edit" data-action="rename-project" data-id="${p.id}" title="이름 수정">✎</span>`:'';
    const cfg = mine?`<span class="pi-share" data-action="share-config" data-id="${p.id}" title="공유 설정">👥</span>`:'';
    const del = mine?`<span class="pi-del" data-action="delete-project" data-id="${p.id}" title="프로젝트 삭제">×</span>`:'';
    h+=`<button class="proj-item${state.ui.projectFilter===p.id?' active':''}" data-action="select-project" data-id="${p.id}" style="--pc:${p.color}">
      <span class="pi-pin${on?' on':''}" data-action="toggle-pin" data-id="${p.id}" role="checkbox" aria-checked="${on?'true':'false'}" title="${on?'고정 해제':'이 프로젝트 고정(체크한 것만 보기)'}"></span>
      <span class="pi-dot"></span><span class="pi-name">${esc(p.name)}${badge}</span>
      <span class="pi-cnt">${cnt[p.id]||0}</span>
      ${up}${dn}${ren}${cfg}${del}</button>`;
  });
  sidebarProjects.innerHTML=h;
  const pf=state.ui.projectFilter;
  // 추가바 기본 프로젝트: 드릴다운 중이면 그 프로젝트 / 고정 뷰면 첫 고정 프로젝트(안 그러면 '없음'→고정필터에 가려 사라짐) / 그 외 없음
  const firstPinned=(pf==='pinned')?orderedProjects().find(p=>pinned.has(p.id)):null;
  const defProj=(pf&&pf!=='all'&&pf!=='pinned')?pf:(firstPinned?firstPinned.id:'none');
  addProject.innerHTML=projectOptions(defProj);
  const done=state.tasks.filter(t=>t.type!=='event'&&t.done).length;
  sideStat.innerHTML=`할 일 <b>${all}</b> · 완료 <b>${done}</b>`;
}

function progressHTML(list){
  const tasks=list.filter(x=>x.type!=='event');   // 진행률은 '할 일'만
  const total=tasks.length,done=tasks.filter(x=>x.done).length;
  if(!total)return '';
  const pct=Math.round(done/total*100);
  return `<div class="prog"><div class="progbar"><i style="width:${pct}%"></i></div><span class="progtxt">${done}/${total} 완료</span></div>`;
}
function emptyHTML(t,s){return `<div class="empty"><div class="em">🗒️</div><h3>${t}</h3>${s?`<p>${s}</p>`:''}</div>`;}

/* mode: 'day'(날짜별-일 · grip/미루기/기간 진행표시) | 'full'(프로젝트별·전체 · 날짜 전부) | 'compact'(주 뷰 · 날짜배지 최소) */
function cardHTML(t,opts){
  opts=opts||{};const mode=opts.mode||'full';const ev=isEvent(t);
  const p=projectById(t.project);
  const dm=dateMeta(t);
  const rangePill=b=>`<span class="pill range" title="${dm.startKo} ~ ${dm.endKo} · 총 ${dm.total}일">📅 ${dm.short}${b?` <b>${dm.idx}/${dm.total}</b>`:''}</span>`;
  const carryPill=b=>`<span class="pill carry" title="${dm.startKo}에 시작한 미완료 — 완료할 때까지 오늘로 자동 연장">⏳ ${md(t.date)}부터${b?` <b>${dm.total}일째</b>`:''}</span>`;
  let dateTag='';
  if(mode==='day'){
    if(dm.kind==='range')dateTag=rangePill(true);
    else if(dm.kind==='carry')dateTag=carryPill(true);
  }else{
    if(dm.kind==='range')dateTag=rangePill(false);
    else if(dm.kind==='carry')dateTag=carryPill(false);
    else if(mode==='full'){
      if(dm.kind==='single')dateTag=`<span class="pill date">${fmtShort(t.date)}</span>`;
      else dateTag=`<span class="pill date none">날짜 미정</span>`;
    }
  }
  const timePill=(ev&&t.time)?`<span class="pill time">🕒 ${esc(t.time)}</span>`:'';
  const projPill=p.real?`<span class="pill proj" style="--pc:${p.color}">${esc(p.name)}</span>`:`<span class="pill proj etc">기타</span>`;
  const post=(mode==='day')?`<button class="iconbtn post" data-action="postpone" data-id="${t.id}" title="${ev?'다음 날로':'내일로 미루기'}">→</button>`:'';
  const grip=(mode==='day'&&!ev)?`<span class="grip" title="드래그해서 순서 변경" aria-hidden="true">⠿</span>`:'';
  const lead=ev
    ? `<span class="evmark" title="일정">📅</span>`
    : `<button class="check" data-action="toggle" data-id="${t.id}" aria-label="완료 토글"></button><span class="pdot ${t.priority}"></span>`;
  return `<div class="task${ev?' event':''}${(!ev&&t.done)?' done':''}" data-id="${t.id}">
    ${grip}${lead}
    <div class="ttext" data-action="edit" data-id="${t.id}">${esc(t.text)}${t.note?` <span class="noteicon" title="${esc(t.note)}">📝</span>`:''}</div>
    ${timePill}${projPill}${dateTag}
    <div class="acts">${post}
      <button class="iconbtn" data-action="edit" data-id="${t.id}" title="수정">✏️</button>
      <button class="iconbtn" data-action="delete" data-id="${t.id}" title="삭제">🗑</button>
    </div>
  </div>`;
}
function editHTML(t){
  const doneTask=t.done&&!isEvent(t); // 완료된 할 일: 종료일 칸 = 완료일 (실제 완료한 날을 보여주고, 바꾸면 완료 기록도 함께 조정)
  return `<div class="task editing" data-id="${t.id}">
    <form class="editform" data-id="${t.id}">
      <input class="ef-text" id="ef-text" value="${esc(t.text)}" placeholder="${isEvent(t)?'일정':'할 일'}">
      <div class="ef-row">
        <select id="ef-type">
          <option value="task"${isEvent(t)?'':' selected'}>✓ 할 일</option>
          <option value="event"${isEvent(t)?' selected':''}>📅 일정</option>
        </select>
        <select id="ef-proj">${projectOptions(t.project)}</select>
        <select id="ef-pri"${isEvent(t)?' hidden':''}>${priOptions(t.priority)}</select>
        <input type="time" id="ef-time" value="${t.time||''}"${isEvent(t)?'':' hidden'} title="시간 (선택)">
        <input type="date" id="ef-date" value="${t.date||''}" title="시작일 (비우면 ‘날짜 미정’)">

        <input type="date" id="ef-dateEnd" value="${doneTask?(effEnd(t)||''):(t.endDate||'')}" min="${t.date||''}" title="${doneTask?'완료일 (완료한 날 · 바꾸면 완료 기록도 함께 조정돼요)':'종료일 (선택 · 여러 날에 걸친 일이면 지정 · 지난 날짜로 지정하면 그 날 완료로 자동 체크)'}">
      </div>
      <textarea class="ef-note" id="ef-note" placeholder="메모 (선택)">${esc(t.note||'')}</textarea>
      <div class="ef-acts">
        <button type="submit" class="btn primary">저장</button>
        <button type="button" class="btn" data-action="cancel-edit">취소</button>
        <button type="button" class="btn danger" data-action="delete" data-id="${t.id}">삭제</button>
      </div>
    </form>
  </div>`;
}
const cardOrEdit=(t,mode)=>state.ui.editingId===t.id?editHTML(t):cardHTML(t,{mode:mode||'full'});

function renderList(){
  const view=state.ui.view,visible=visibleTasks();
  let html='';
  if(view==='date'){
    const period=state.ui.period||'day';
    if(period==='week')html=renderWeek(visible);
    else if(period==='month')html=renderMonth(visible);
    else html=renderDay(visible);
  }else if(view==='project'){
    const projs=state.ui.projectFilter==='all'?orderedProjects()
      :state.ui.projectFilter==='pinned'?orderedProjects().filter(p=>(state.ui.projFilter||[]).indexOf(p.id)>=0)
      :state.projects.filter(p=>p.id===state.ui.projectFilter);
    const groups=projs.map(p=>({p,list:visible.filter(t=>t.project===p.id)}));
    if(state.ui.projectFilter==='all'){
      const none=visible.filter(t=>!state.projects.find(p=>p.id===t.project));
      if(none.length)groups.push({p:{id:'none',name:'기타',color:'#8b9a8f'},list:none});
    }
    const ne=groups.filter(g=>g.list.length);
    if(!ne.length)html+=emptyHTML('항목이 없어요','');
    for(const g of ne){
      g.list.sort(cmpProjGroup);   // 완료된 할 일은 그룹 맨 아래, 나머지는 날짜·시간순
      html+=`<div class="section-h"><span class="dot" style="background:${g.p.color}"></span>${esc(g.p.name)} <span class="cnt">${g.list.length}</span></div>`;
      html+=progressHTML(g.list)+g.list.map(t=>cardOrEdit(t,'full')).join('');
    }
  }else{ // all — ①완료 여부(완료는 전부 맨 아래) ②프로젝트별 ③날짜·시간
    const list=visible.slice().sort(cmpAllView);
    html+=progressHTML(list);
    html+=list.length?list.map(t=>cardOrEdit(t,'full')).join(''):emptyHTML('항목이 없어요','');
  }
  listContainer.innerHTML=html;
}
function renderDay(visible){
  const sd=state.ui.selectedDate;
  const day=visible.filter(t=>spansDate(t,sd)).sort(cmpItems);
  let html=progressHTML(day);
  html+=day.length?day.map(t=>cardOrEdit(t,'day')).join(''):emptyHTML('이 날에 항목이 없어요','아래에서 할 일이나 일정을 추가해 보세요');
  const backlog=visible.filter(t=>!t.date&&(isEvent(t)||!t.done)).sort(cmpItems);
  if(backlog.length){
    html+=`<div class="section-h backlog">📥 날짜 미정 <span class="cnt">${backlog.length}</span></div>`;
    html+=backlog.map(t=>cardOrEdit(t,'full')).join('');
  }
  return html;
}
function weekItemHTML(t,ds){
  const p=projectById(t.project),ev=isEvent(t);
  const pc=p.real?p.color:'var(--line-strong)';
  const lead=ev
    ? `<span class="wk-time">${t.time?esc(t.time):'📅'}</span>`
    : `<button class="wk-check" data-action="toggle" data-id="${t.id}" aria-label="완료 토글"></button>`;
  return `<div class="wk-item${ev?' ev':''}${(!ev&&t.done)?' done':''}" style="--pc:${pc}" data-action="goto-day" data-date="${ds}" title="${esc(t.text)}${t.note?' · '+esc(t.note):''}">
    ${lead}<span class="wk-t">${esc(t.text)}</span></div>`;
}
function renderWeek(visible){
  const base=parseYmd(state.ui.selectedDate),start=new Date(base);
  start.setDate(base.getDate()-base.getDay());   // 일요일 시작
  const today=todayYmd();const wdCls=['sun','','','','','','sat'];let cols='';
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const ds=ymd(d),dow=d.getDay();
    const items=visible.filter(t=>spansDate(t,ds)).sort(cmpItems);
    const isT=ds===today;
    const body=items.length?items.map(t=>weekItemHTML(t,ds)).join(''):'<div class="wk-empty">—</div>';
    cols+=`<div class="wk-col${isT?' today':''}">
      <div class="wk-head" data-action="goto-day" data-date="${ds}" title="${ds} 상세 보기">
        <span class="d ${wdCls[dow]}">${d.getDate()}${isT?' · 오늘':''}</span>
        <span class="wd">${d.getMonth()+1}월 (${WD[dow]})</span>
      </div>
      <div class="wk-body">${body}</div>
    </div>`;
  }
  return `<div class="wk">${cols}</div>`;
}
function renderMonth(visible){
  const base=parseYmd(state.ui.selectedDate),y=base.getFullYear(),m=base.getMonth();
  const lead=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),today=todayYmd();
  const wdCls=['sun','','','','','','sat'];
  let cells='';
  for(let i=0;i<7;i++)cells+=`<div class="cal-wd ${wdCls[i]}">${WD[i]}</div>`;
  for(let i=0;i<lead;i++)cells+='<div class="cal-cell blank"></div>';
  const MAX=3;
  for(let dn=1;dn<=dim;dn++){
    const d=new Date(y,m,dn),ds=ymd(d),dow=d.getDay();
    const items=visible.filter(t=>spansDate(t,ds)).sort(cmpItems);
    let chips='';
    items.slice(0,MAX).forEach(t=>{
      const pr=projectById(t.project),ev=isEvent(t);
      const pc=pr.real?pr.color:'var(--line-strong)';
      const cls='cal-chip'+(ev?' ev':(t.done?' done':''));
      const label=ev?`${t.time?esc(t.time)+' ':''}${esc(t.text)}`:esc(t.text);
      chips+=`<div class="${cls}" style="--pc:${pc}" title="${esc(t.text)}">${label}</div>`;
    });
    if(items.length>MAX)chips+=`<div class="cal-more">+${items.length-MAX}</div>`;
    cells+=`<div class="cal-cell${ds===today?' today':''}" data-action="goto-day" data-date="${ds}">
      <div class="cal-daynum ${wdCls[dow]}">${dn}</div>${chips}</div>`;
  }
  return `<div class="cal">${cells}</div>`;
}

function shiftDate(dir){
  const x=parseYmd(state.ui.selectedDate),period=state.ui.period||'day';
  if(period==='week')x.setDate(x.getDate()+dir*7);
  else if(period==='month'){x.setDate(1);x.setMonth(x.getMonth()+dir);}
  else x.setDate(x.getDate()+dir);
  state.ui.selectedDate=ymd(x);Store.prefs.save();syncHeader();renderList();
}
function toggleDone(id){
  const t=taskById(id);if(!t||isEvent(t))return;
  const nd=!t.done;let da=null;
  if(nd){
    da=todayYmd();
    // 지난 날짜 화면(일 뷰)에서 체크하면 '그 날 완료'로 기록 — 뒤늦게 확인해도 당일 완료 처리 가능
    if(state.ui.view==='date'&&(state.ui.period||'day')==='day'&&state.ui.selectedDate&&state.ui.selectedDate<da)da=state.ui.selectedDate;
    if(t.date&&da<t.date)da=t.date; // 시작일 이전으로는 안 감
  }
  Store.tasks.update(id,{done:nd,doneAt:da});renderProjects();renderList();
}
function delTask(id){const t=taskById(id);if(!t)return;if(state.ui.editingId===id)state.ui.editingId=null;Store.tasks.remove(id);renderProjects();renderList();}
function saveEdit(id){
  const t=taskById(id);if(!t)return;
  const newText=($('ef-text').value.trim())||t.text;
  const type=$('ef-type').value==='event'?'event':'task';
  let sd=$('ef-date').value||null,ed=$('ef-dateEnd').value||null;const rawEd=ed;
  if(!sd&&ed){sd=ed;ed=null;}                        // 시작 없이 종료만 입력 → 그 날짜를 날짜로(단일). 입력한 날짜를 버리지 않음
  else if(sd&&ed&&ed<sd){const tmp=sd;sd=ed;ed=tmp;} // 종료<시작 → 두 날짜 자동 정렬
  if(ed&&ed===sd)ed=null;                            // 시작=종료 → 하루짜리
  const patch={text:newText,type,project:$('ef-proj').value,date:sd,endDate:ed,time:type==='event'?($('ef-time').value||null):null,note:$('ef-note').value.trim()};
  if(type!=='event')patch.priority=$('ef-pri').value;
  if(type==='event'&&t.done){patch.done=false;patch.doneAt=null;}   // 일정으로 바꾸면 완료상태 해제
  else if(t.done&&type!=='event'&&sd){const ne=ed||sd;if(t.doneAt!==ne)patch.doneAt=ne;} // 완료된 할 일: 편집한 날짜가 최우선 — 완료일(doneAt)을 입력한 종료일에 맞춰 화면에도 그대로 반영
  else if(!t.done&&type!=='event'&&rawEd&&sd){const fin=ed||sd;if(fin<todayYmd()){patch.done=true;patch.doneAt=fin;}} // 미완료 할 일에 지난 날짜로 종료일 지정 → 그 날 완료한 것으로 자동 체크(자동 연장 종료)
  Store.tasks.update(id,patch);
  state.ui.editingId=null;renderProjects();renderList();
  if(patch.done&&!t.done)toast('종료일이 지난 할 일이라 완료 처리했어요 ✓');
  else if(!t.done&&type!=='event'&&rawEd&&!ed&&sd&&sd<todayYmd())toast('미완료 할 일은 완료 전까지 오늘로 자동 연장돼요 · 완료 체크하면 그 날로 정리됩니다');
}

function reorderTask(srcId,targetId,after){
  if(!state)return;
  const ts=state.tasks.slice();const from=ts.findIndex(t=>t.id===srcId);if(from<0)return;
  const[moved]=ts.splice(from,1);
  let to=ts.findIndex(t=>t.id===targetId);
  if(to<0){ts.push(moved);}else{if(after)to++;ts.splice(to,0,moved);}
  Store.tasks.setAll(ts);renderList();
}

/* ---------- 일회성 추가(시드) ----------
   여기에 항목을 넣어두면 새로고침 때 '한 번만' 보드에 추가됩니다.
   (각 항목의 seed id로 중복을 막으므로 여러 번 새로고침해도 안전)
   보드에 반영된 뒤에는 이 배열을 비워도 됩니다. project는 이름으로 매칭(없으면 '프로젝트 없음'). */
const PENDING_SEEDS=[
  {seed:'20260626-1',  date:'2026-06-26', text:'상판 컬러 배치', done:true},
  {seed:'20260626-1b', date:'2026-06-26', text:'책상 번호 배치'},
  {seed:'20260626-2',  date:'2026-06-26', text:'휴대폰보관함'},
  {seed:'20260626-3',  date:'2026-06-26', text:'카운터'},
  {seed:'20260629-lg', date:'2026-06-29', text:'LG 유플러스 인터넷 설치 확인', project:'대치5호점'},
];
function applySeeds(){
  const have=new Set(state.tasks.map(t=>t.seed).filter(Boolean));
  PENDING_SEEDS.forEach((s,i)=>{
    if(have.has(s.seed))return;
    const proj=s.project?(state.projects.find(p=>p.name===s.project)||{}).id||'none':'none';
    state.tasks.push({id:uid(),seed:s.seed,text:s.text,project:proj,priority:s.priority||'mid',
      done:!!s.done,createdAt:Date.now()+i,date:s.date||null,endDate:s.endDate||null,doneAt:null,note:''});
  });
  // 영속화는 boot()의 단일 Store.bulk()가 일괄 처리 (변경 여부와 무관하게 1회 안전 기록)
}
/* ---------- 일회성 보정(마이그레이션) ----------
   이미 보드에 반영된 항목을 한 번만 수정. 조건문이 idempotent라 여러 번 실행해도 안전. */
function applyMigrations(){
  // 합쳐져 있던 '상판 컬러 배치 & 책상 번호'를 → '상판 컬러 배치'(완료)로 바꾸고, 책상 번호는 위 시드(20260626-1b)로 분리됨
  const c=state.tasks.find(t=>t.seed==='20260626-1'&&t.text.includes('&'));
  if(c){c.text='상판 컬러 배치';c.done=true;}
  // '완료 항목 보기' 기본 ON — 기존 보드도 딱 한 번만 켜줌(이후 사용자가 끄면 그 선택을 유지)
  if(!state.ui._defShowDone){state.ui.showDone=true;state.ui._defShowDone=true;}
  // 모든 할일을 '대치5호점'으로 일괄 재배정 — 딱 한 번(이후 사용자가 추가/변경한 프로젝트는 유지)
  if(!state.ui._allToDaechi5){
    const d5=state.projects.find(p=>p.name==='대치5호점');
    if(d5){state.tasks.forEach(t=>{t.project=d5.id;});state.ui._allToDaechi5=true;}
  }
  // 'ini' 프로젝트 생성 + '이니 메이크업 9:30' 오늘 완료 상태로 추가 — 딱 한 번.
  // (위 대치5호점 일괄 재배정 '이후'에 추가하므로 ini 할당이 덮어쓰이지 않음. seed로도 한 번 더 중복방지)
  if(!state.ui._iniAdded && !state.tasks.some(t=>t.seed==='20260627-ini')){
    let ini=state.projects.find(p=>p.name==='ini');
    if(!ini){ini={id:uid(),name:'ini',color:'#3f8577'};state.projects.push(ini);}
    state.tasks.push({id:uid(),seed:'20260627-ini',text:'이니 메이크업 9:30',project:ini.id,priority:'mid',
      done:true,createdAt:Date.now(),date:'2026-06-27',endDate:null,doneAt:'2026-06-27',note:''});
    state.ui._iniAdded=true;
  }
  // 영속화는 boot()의 단일 Store.bulk()가 일괄 처리
}
function ensureDaechi5(){ // '대치5호점' 프로젝트 보장 (딱 한 번만 생성)
  if(state.ui._daechi5Added)return;
  if(!state.projects.find(p=>p.name==='대치5호점'))
    state.projects.push({id:uid(),name:'대치5호점',color:'#b3702f'});
  state.ui._daechi5Added=true; // 영속화는 boot()의 Store.bulk()가 처리
}

    const el=$('acctEmail'),nm=(u.name||'').trim(),em=u.email||'';
    el.innerHTML = nm ? `<b>${esc(nm)}</b>${em?` <span class="acct-mail">(${esc(em)})</span>`:''}` : esc(em||'로그인됨');
    el.title = (nm&&em) ? `${nm} (${em})` : em;
  }
}
async function maybeOfferMigration(){ // 첫 로그인 + 클라우드 비어있음 + 로컬데이터 있음 → 1회 업로드 제안
  if(state.ui._uploadedToCloud)return;
  const local=Store.localData();
  const hasLocal=local&&((local.tasks&&local.tasks.length)||(local.projects&&local.projects.length));
  const cloudEmpty=state.tasks.length===0&&state.projects.length===0;
  if(hasLocal&&cloudEmpty&&confirm('이 브라우저에 저장돼 있던 기존 할일/프로젝트를 클라우드 계정으로 올릴까요?\n(프로젝트는 팀 공유로 올라갑니다. 나중에 개인으로 바꿀 수 있어요.)')){
    try{ const n=await Store.migrateLocalToCloud(); toast(`올렸어요 — 프로젝트 ${n.projects} · 할일 ${n.tasks}`); }
    catch(e){ toast('업로드 실패 — 잠시 후 다시 시도해 주세요'); return; }
  }
  state.ui._uploadedToCloud=true; Store.prefs.save();
}
async function enterApp(fresh){
  hideLogin();
  state=Store.facade();
  if(Store.mode!=='local')await maybeOfferMigration();
  normalizeProjFilter(fresh===true);   // fresh(최초 로그인)일 때만 고정 뷰로 승격 · 리로드는 저장된 뷰 존중
  updateAccountUI();
  render();
  toggleAddType();
  addText.focus();
}
const loginForm=$('loginForm');
if(loginForm)loginForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const isSignup=$('loginTitle').textContent.indexOf('회원가입')>=0;
  const err=$('loginErr');err.hidden=true;
  const email=$('loginEmail').value.trim(),pw=$('loginPw').value,name=$('loginName').value.trim();
  if(isSignup&&!name){err.textContent='이름을 입력해 주세요';err.hidden=false;$('loginName').focus();return;}
  const btn=$('loginSubmit');btn.disabled=true;
  try{
    if(isSignup)await Store.auth.signup(email,pw,name);
    else await Store.auth.signin(email,pw);
    await enterApp(true);   // 최초 로그인 = fresh → 고정 셋 있으면 고정 뷰로 기본 진입
  }catch(ex){err.textContent=(ex&&ex.message)?('실패: '+ex.message):'로그인에 실패했어요';err.hidden=false;}
  finally{btn.disabled=false;}
});
const pwForm=$('pwForm');
if(pwForm)pwForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const np=$('pwNew').value, np2=$('pwNew2').value, err=$('pwErr');err.hidden=true;
  if(np.length<6){err.textContent='6자 이상 입력해 주세요';err.hidden=false;return;}
  if(np!==np2){err.textContent='두 비밀번호가 일치하지 않아요';err.hidden=false;return;}
  const btn=$('pwSubmit');btn.disabled=true;
  try{ await Store.auth.changePassword(np); showPw(false); toast('비밀번호를 변경했어요'); }
  catch(ex){ err.textContent=(ex&&ex.message)?('실패: '+ex.message):'변경에 실패했어요'; err.hidden=false; }
  finally{ btn.disabled=false; }
});
const profileForm=$('profileForm');
if(profileForm)profileForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('profName').value.trim(), email=$('profEmail').value.trim(), err=$('profErr');err.hidden=true;
  if(!name){err.textContent='이름을 입력해 주세요';err.hidden=false;return;}
  if(!email){err.textContent='이메일을 입력해 주세요';err.hidden=false;return;}
  const btn=$('profSubmit');btn.disabled=true;
  try{ await Store.auth.updateProfile(name,email); showProfile(false); updateAccountUI(); toast('정보를 저장했어요'); }
  catch(ex){ err.textContent=(ex&&ex.message)?('실패: '+ex.message):'저장에 실패했어요'; err.hidden=false; }
  finally{ btn.disabled=false; }
});

/* ---------- 프로젝트 공유 설정 (생성자만 · 멤버 목록 편집) ---------- */
let _shareProjId=null;
function updateShareMembersVis(){ const b=$('shareMembers'); if(b)b.hidden=$('shareMode').value!=='list'; }
async function openShareConfig(pid){
  const p=state.projects.find(x=>x.id===pid); if(!p)return;
  _shareProjId=pid;
  $('shareTitle').textContent=`‘${p.name}’ 공유 설정`;
  $('shareMode').value = p.shared===true ? 'team' : ((p.members&&p.members.length)?'list':'personal');
  $('shareErr').hidden=true;
  const box=$('shareMembers'); box.innerHTML='<div class="empty-dir">불러오는 중…</div>';
  updateShareMembersVis();
  $('shareScreen').hidden=false;
  let dir=[];
  try{ dir=await Store.directory(); }
  catch(e){ if(_shareProjId===pid)box.innerHTML='<div class="empty-dir">가입자 목록을 불러오지 못했어요.</div>'; return; }
  if(_shareProjId!==pid)return;                      // 그새 닫힘/전환
  const me=Store.auth.currentUser(), meId=me?me.id:null;
  const others=dir.filter(u=>u.id!==meId && !/@example\.com$/i.test(u.email||'')); // 테스트 계정(@example.com) 숨김
  const sel=new Set(p.members||[]);
  box.innerHTML = others.length
    ? others.map(u=>{const nm=(u.name||'').trim();const label=nm?`${esc(nm)} <span class="dir-mail">${esc(u.email||'')}</span>`:esc(u.email||u.id);return `<label><input type="checkbox" value="${u.id}"${sel.has(u.id)?' checked':''}> ${label}</label>`;}).join('')
    : '<div class="empty-dir">공유할 다른 가입자가 없어요.<br>(상대가 먼저 이 보드에 가입해야 해요)</div>';
}
const shareForm=$('shareForm');
if(shareForm)shareForm.addEventListener('submit',e=>{
  e.preventDefault(); if(!_shareProjId)return;
  const mode=$('shareMode').value;
  let shared=false, members=[];
  if(mode==='team'){ shared=true; members=[]; }
  else if(mode==='list'){ members=Array.from($('shareMembers').querySelectorAll('input[type=checkbox]:checked')).map(i=>i.value); }
  const p=state.projects.find(x=>x.id===_shareProjId);
  Store.projects.update(_shareProjId,{shared,members});
  $('shareScreen').hidden=true; _shareProjId=null;
  renderProjects();renderList();
  toast(`‘${p?p.name:''}’ 공유 설정 저장`);
});

/* ---------- 시작 ---------- */
async function boot(){
  Store.onChange(render);                                        // 원격 비동기 갱신 시 재렌더
  await Store.init();                                            // 로컬: 마이크로태스크 즉시 resolve / 원격: 토큰 있으면 클라우드 적재
  state=Store.facade();                                          // 별칭 1회 바인딩
  if(Store.mode==='local'){ Store.bulk(function(){ ensureDaechi5();applySeeds();applyMigrations(); }); } // 시드/마이그는 로컬 모드만
  if(Store.auth.requiresLogin()){ showLogin(true); updateAccountUI(); return; } // 원격+미로그인 → 로그인 화면
  await enterApp();
}
boot();

// 설치형(홈 화면) 앱엔 사파리의 '당겨서 새로고침'이 없음 → 앱이 화면에 복귀하면 자동 재동기화
let _lastResync=Date.now();
async function resyncOnReturn(){
  if(document.visibilityState!=='visible')return;
  if(Store.mode==='local'||!Store.auth.isAuthenticated())return;
  if(state&&state.ui.editingId)return;               // 편집 중엔 입력 보호
  if(Date.now()-_lastResync<30000)return;            // 30초 이내 재진입은 생략
  _lastResync=Date.now();
  try{ if(await Store.resync()) render(); }catch(e){}
}
document.addEventListener('visibilitychange',resyncOnReturn);
window.addEventListener('pageshow',function(e){ if(e.persisted) resyncOnReturn(); });

// 구버전 Chrome(안드로이드) PWA 설치 조건 충족용 최소 서비스워커(캐싱 없음) — https에서만
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
